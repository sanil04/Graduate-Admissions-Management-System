# Azure account owner setup, after this code is deployed.
# 1. Create a PostgreSQL Flexible Server and a database named gradadmissions.
# 2. Allow all App Service outbound IPs in the server's Networking firewall rules.
# 3. In App Service > Settings > Environment variables > App settings, add:
#    SPRING_PROFILES_ACTIVE=prod
#    DB_URL=jdbc:postgresql://<server>.postgres.database.azure.com:5432/gradadmissions
#    DB_USERNAME=<database login>
#    DB_PASSWORD=<database password>
# 4. Apply the settings and check Monitoring > Log stream for a successful startup.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Verify the database certificate using Java's trusted certificates.
spring.datasource.hikari.data-source-properties.sslmode=verify-full
spring.datasource.hikari.data-source-properties.sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory

# Keep existing rows while the prototype's schema changes.
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

notifications.base-url=${APP_BASE_URL:https://sysc4806-gradadmissions-fxe8abasgfd9b6ea.francecentral-01.azurewebsites.net}
