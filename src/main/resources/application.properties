spring.application.name=gradadmissions

# Local data resets when the app stops.
spring.datasource.url=jdbc:h2:mem:gradadmissions;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Routing emails (#49). Without spring.mail.host they are only logged.
notifications.from=no-reply@gradadmissions.local
notifications.base-url=http://localhost:8080
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
