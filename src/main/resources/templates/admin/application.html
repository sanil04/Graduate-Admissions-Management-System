<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Application')}"><title>Application</title></head>
<body>
<header th:replace="~{fragments/layout :: header('admin')}"></header>
<main class="container">
    <h1 th:text="${app.personalInfo.firstName} + ' ' + ${app.personalInfo.lastName}">Ada Lovelace</h1>
    <p class="lead">Status: <span class="status" th:text="${app.status}">SUBMITTED</span></p>

    <h2>Personal information</h2>
    <dl class="details">
        <dt>Email</dt>
        <dd th:text="${app.personalInfo.email}">ada@example.com</dd>
        <dt>Phone number</dt>
        <dd th:text="${app.personalInfo.phoneNumber} ?: '-'">613-555-0100</dd>
        <dt>Citizenship</dt>
        <dd th:text="${app.personalInfo.citizenship} ?: '-'">Canada</dd>
    </dl>

    <h2>Application</h2>
    <dl class="details">
        <dt>Admission cycle</dt>
        <dd th:text="${app.cycle.name}">Fall 2027</dd>
        <dt>Submitted</dt>
        <dd th:text="${#temporals.format(app.submittedAt, 'yyyy-MM-dd HH:mm')}">2026-11-07 12:00</dd>
        <dt>Desired research field</dt>
        <dd th:text="${app.desiredField} ? ${app.desiredField.name} : '-'">AI</dd>
        <dt>Preferred professors</dt>
        <dd>
            <ul class="plain-list">
                <li th:each="professor : ${app.preferredProfessors}" th:text="${professor.name}">Alice Chen</li>
            </ul>
        </dd>
    </dl>

    <p><a th:href="@{/admin/applications}">&larr; Back to all applications</a></p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
