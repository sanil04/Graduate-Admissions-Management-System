<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Application documents')}"><title>Application documents</title></head>
<body>
<header th:replace="~{fragments/layout :: header('applicant')}"></header>
<main class="container">
    <h1>Application documents</h1>
    <p>Upload your CV, diploma and grade audit as PDFs, up to 5 MB each. Uploading the same type replaces its previous file.</p>
    <p role="status" th:if="${message}" th:text="${message}">Document uploaded.</p>
    <p role="alert" th:if="${error}" th:text="${error}">Upload failed.</p>
    <ul>
        <li th:each="document : ${documents}">
            <span th:text="${document.type}">CV</span>:
            <span th:text="${document.fileName}">cv.pdf</span>
            (<span th:text="${document.size}">1000</span> bytes)
        </li>
    </ul>
    <form th:action="@{/apply/{id}/documents(id=${app.id})}" method="post" enctype="multipart/form-data">
        <p><label for="type">Document type</label>
            <select id="type" name="type" required>
                <option th:each="type : ${types}" th:value="${type}" th:text="${type}">CV</option>
            </select>
        </p>
        <p><label for="file">PDF file (up to 5 MB)</label>
            <input id="file" name="file" type="file" accept="application/pdf,.pdf" required>
        </p>
        <button type="submit">Upload document</button>
    </form>
    <p><a th:href="@{/apply}">Back to application</a></p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
