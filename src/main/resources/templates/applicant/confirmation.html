<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Application submitted')}"><title>Application submitted</title></head>
<body>
<header th:replace="~{fragments/layout :: header('applicant')}"></header>
<main class="container">
    <h1>Application submitted</h1>
    <p class="lead">Thank you, <span th:text="${app.personalInfo.firstName}">Ada</span>. We have received your application.</p>
    <dl>
        <dt>Status</dt>
        <dd th:text="${app.status}">SUBMITTED</dd>
        <dt>Submitted at</dt>
        <dd th:text="${#temporals.format(app.submittedAt, 'yyyy-MM-dd HH:mm')}">2026-11-07 12:00</dd>
        <dt>Research field</dt>
        <dd th:text="${app.desiredField.name}">AI</dd>
        <dt>Preferred professors</dt>
        <dd>
            <ul>
                <li th:each="professor : ${app.preferredProfessors}" th:text="${professor.name}">Professor</li>
            </ul>
        </dd>
    </dl>
    <p><a th:href="@{/}">&larr; Back to home</a></p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
