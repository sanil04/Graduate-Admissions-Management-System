<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
<!--
  Shared layout. Pages use it like this:

    <head th:replace="~{fragments/layout :: head('Page title')}"></head>
    <body>
      <header th:replace="~{fragments/layout :: header('applicant')}"></header>
      <main> ... </main>
      <footer th:replace="~{fragments/layout :: footer}"></footer>
    </body>

  The header argument is the active section: 'home', 'applicant', 'professor' or 'admin'.
  Add new nav links ONLY in the header fragment below, and only once the page exists.
-->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Graduate Admissions'">Graduate Admissions</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:fragment="header(active)" class="site-header">
    <div class="container header-inner">
        <a class="brand" th:href="@{/}">Graduate Admissions</a>
        <nav aria-label="Main navigation">
            <ul class="nav">
                <li><a th:href="@{/}" th:classappend="${active == 'home'} ? 'active'"
                       th:attr="aria-current=${active == 'home'} ? 'page'">Home</a></li>
                <li><a th:href="@{/applicant}" th:classappend="${active == 'applicant'} ? 'active'"
                       th:attr="aria-current=${active == 'applicant'} ? 'page'">Applicant</a></li>
                <li><a th:href="@{/professor}" th:classappend="${active == 'professor'} ? 'active'"
                       th:attr="aria-current=${active == 'professor'} ? 'page'">Professor</a></li>
                <li><a th:href="@{/admin}" th:classappend="${active == 'admin'} ? 'active'"
                       th:attr="aria-current=${active == 'admin'} ? 'page'">Admin</a></li>
            </ul>
        </nav>
    </div>
</header>
<footer th:fragment="footer" class="site-footer">
    <div class="container">SYSC 4806 Graduate Admissions Management System</div>
</footer>
</body>
</html>
