<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Log in')}"><title>Log in</title></head>
<body>
<header th:replace="~{fragments/layout :: header('login')}"></header>
<main class="container">
    <h1>Log in</h1>
    <p class="notice" th:if="${param.error}">Wrong email or password.</p>
    <p class="notice" th:if="${param.logout}">You have been logged out.</p>

    <!-- th:action adds the hidden CSRF token that Spring Security requires on every POST. -->
    <form class="login-form" th:action="@{/login}" method="post">
        <p>
            <label for="email">Email</label><br>
            <input id="email" name="email" type="email" autocomplete="username" required autofocus>
        </p>
        <p>
            <label for="password">Password</label><br>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </p>
        <p><button type="submit">Log in</button></p>
    </form>
    <p><a th:href="@{/}">&larr; Back to home</a></p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
